name: Offline Verification & Privacy Gate

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  PYTHONUTF8: "1"

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile-check all Python files
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter *.py | ForEach-Object { $_.FullName }
          python -m py_compile $files

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run 60s offline demo
        run: python demo/run_demo.py

      - name: Run privacy and scraper leak audit
        run: python scripts/privacy_audit.py
